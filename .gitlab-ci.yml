# GitLab CI/CD for the Velyx monorepo (registry app + tools/cli).
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   GITLAB_PUSH_TOKEN  Project access token (Maintainer, write_repository) used to
#                      push the changelog commit and CLI release tags.
#   NPM_TOKEN          npm automation token for publishing the CLI.
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_PORT (optional, default 22)
#   DEPLOY_SSH_KEY     File-type variable holding the private deploy key.
#   CODECOV_TOKEN      Optional; coverage is uploaded to Codecov when set.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - prepare
  - build
  - test
  - release
  - deploy

default:
  interruptible: true

variables:
  PHP_EXTENSIONS: intl zip pcntl sockets pcov

# ─── Templates ──────────────────────────────────────────────────────────────

.app-rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|main|master)$/
    - if: $CI_COMMIT_BRANCH =~ /^(develop|main|master)$/
    - if: $CI_PIPELINE_SOURCE == "web"

.cli-rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      changes:
        - tools/cli/**/*
    - if: $CI_COMMIT_BRANCH =~ /^(main|feat\/.+|fix\/.+)$/
      changes:
        - tools/cli/**/*

.php:
  image: php:8.4-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
    - chmod +x /usr/local/bin/install-php-extensions
    - install-php-extensions $PHP_EXTENSIONS @composer > /dev/null

.pnpm-root:
  image: node:22
  before_script:
    - corepack enable && corepack prepare pnpm@9 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

.pnpm-cli:
  before_script:
    - cd tools/cli
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store-cli"
  cache:
    key:
      files: [tools/cli/pnpm-lock.yaml]
    paths: [.pnpm-store-cli]

# ─── Registry app ───────────────────────────────────────────────────────────

composer:
  stage: prepare
  extends: [.php, .app-rules]
  script:
    - composer install --no-interaction --prefer-dist --no-progress
  cache:
    key:
      files: [composer.lock]
    paths: [vendor]
  artifacts:
    paths: [vendor]
    expire_in: 1 day

assets:
  stage: build
  extends: [.pnpm-root, .app-rules]
  needs: [composer]
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
  artifacts:
    paths: [public/build]
    expire_in: 1 day

lint:
  stage: test
  extends: [.php, .app-rules]
  needs: [composer]
  script:
    - vendor/bin/pint --test --format agent

test:
  stage: test
  extends: [.php, .app-rules]
  needs: [composer, assets]
  variables:
    DB_CONNECTION: sqlite
    DB_DATABASE: database/database.sqlite
  script:
    - cp .env.example .env
    - php artisan key:generate
    - mkdir -p database && touch database/database.sqlite
    - php artisan migrate --force
    - php artisan registry:validate
    - php artisan test --compact --coverage --coverage-cobertura=coverage.xml
    - |
      if [ -n "$CODECOV_TOKEN" ]; then
        curl -sSLf -o codecov https://cli.codecov.io/latest/linux/codecov && chmod +x codecov
        ./codecov upload-process -t "$CODECOV_TOKEN" -f coverage.xml || true
      fi
  coverage: '/^\s*Total:?\s+(\d+(?:\.\d+)?)\s?%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [lint, test, assets]
  interruptible: false
  resource_group: production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache openssh-client > /dev/null
    - chmod 600 "$DEPLOY_SSH_KEY"
  script:
    - |
      ssh -i "$DEPLOY_SSH_KEY" -p "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'EOF'
      set -e
      cd "$DEPLOY_PATH"
      git fetch --all --prune
      git checkout main
      git reset --hard origin/main
      composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      php artisan migrate --force
      php artisan optimize:clear
      php artisan optimize
      php artisan queue:restart || true

      # Reload Octane workers to pick up new code in memory.
      php artisan octane:reload

      if command -v pnpm >/dev/null 2>&1; then
        pnpm install --frozen-lockfile
        pnpm build
      fi
      EOF

changelog:
  stage: release
  image: alpine:3.20
  needs: []
  interruptible: false
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - "**/*.php"
        - "**/*.yaml"
        - "**/*.yml"
        - package.json
  before_script:
    - apk add --no-cache git git-cliff > /dev/null
  script:
    - git-cliff --config cliff.toml --output CHANGELOG.md
    - |
      if git diff --quiet CHANGELOG.md; then
        echo "CHANGELOG.md is up to date."
        exit 0
      fi
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci@noreply.gitlab.com"
    - git add CHANGELOG.md
    - 'git commit -m "chore: update CHANGELOG.md"'
    - git push -o ci.skip "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main

# ─── CLI (tools/cli) ────────────────────────────────────────────────────────

cli:
  stage: test
  image: node:20
  extends: [.pnpm-cli, .cli-rules]
  needs: []
  script:
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run typecheck
    - pnpm run test

tag-cli:
  stage: release
  image: alpine:3.20
  needs: [cli]
  interruptible: false
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - tools/cli/**/*
  before_script:
    - apk add --no-cache git jq > /dev/null
  script:
    - VERSION=$(jq -r '.version' tools/cli/package.json)
    - TAG="v$VERSION"
    - REMOTE="https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if git ls-remote --tags "$REMOTE" "refs/tags/$TAG" | grep -q .; then
        echo "Tag $TAG already exists."
        exit 0
      fi
    - git tag "$TAG"
    - git push "$REMOTE" "$TAG"

publish-cli:
  stage: release
  image: node:24
  extends: [.pnpm-cli]
  needs: []
  interruptible: false
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - pnpm install --frozen-lockfile
    - pnpm run build
    - pnpm publish --access public --no-git-checks
