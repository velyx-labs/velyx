name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
  push:
    branches:
      - develop
      - main
      - master
      - workos
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Never cancel a run on main: it may be halfway through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test --format agent

  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations (sqlite)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Validate registry
        run: php artisan registry:validate

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --compact --coverage --coverage-xml=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml/index.xml
          fail_ci_if_error: false

  build:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 1

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      # The server has no Node toolchain: ship the assets built by the `build`
      # job instead of rebuilding them there.
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Owner of storage/, bootstrap/cache and public/build: the user the
          # app (Octane) runs as.
          APP_USER: www-data
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/deploy_key
          SSH="ssh -i $HOME/deploy_key -p ${DEPLOY_PORT:-22} -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_HOST"
          BUILD_ARCHIVE="/tmp/velyx-build-$GITHUB_RUN_ID.tgz"

          tar -czf - build | $SSH "cat > '$BUILD_ARCHIVE'"

          $SSH "DEPLOY_PATH='$DEPLOY_PATH' BUILD_ARCHIVE='$BUILD_ARCHIVE' APP_USER='$APP_USER' bash -se" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          git fetch --all --prune
          git checkout main
          git reset --hard origin/main
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force

          # Swap the new assets in with a rename, so no request sees a half-written build.
          rm -rf public/build.new public/build.old
          mkdir public/build.new
          tar -xzf "$BUILD_ARCHIVE" -C public/build.new --strip-components=1
          if [ -d public/build ]; then mv public/build public/build.old; fi
          mv public/build.new public/build
          rm -rf public/build.old "$BUILD_ARCHIVE"

          php artisan optimize:clear
          php artisan optimize
          php artisan queue:restart || true

          # Deploying as root leaves the files it writes owned by root, which the
          # app user can then no longer rewrite (compiled views, caches, logs).
          if [ "$(id -u)" -eq 0 ]; then
            chown -R "$APP_USER:$APP_USER" storage bootstrap/cache public/build
          fi

          # Reload Octane workers to pick up new code (and the new Vite manifest) in memory.
          php artisan octane:reload
          REMOTE

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/deploy_key
