name: CI

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: make vet
      - run: make test
      - run: make build
      - name: Generated files are up to date
        run: make check-generated

  components:
    name: components (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The locked harness, on the current Laravel.
          - name: latest
            php: '8.4'
          # The oldest Laravel Velyx supports, on the oldest PHP it supports.
          - name: Laravel 10
            php: '8.2'
            testbench: '^8.0'
            pest: '^2.0'
    defaults:
      run:
        working-directory: registry/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - if: ${{ ! matrix.testbench }}
        run: composer install --no-interaction --no-progress
      # Laravel 10 is past end of life and has open advisories, so Composer
      # would refuse it. This harness only renders Blade in a test run.
      - if: ${{ matrix.testbench }}
        run: |
          composer config audit.block-insecure false
          composer require --dev --no-interaction --no-progress --with-all-dependencies \
            "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}"
          composer show laravel/framework | grep -E '^versions'
      - run: vendor/bin/pest --compact
